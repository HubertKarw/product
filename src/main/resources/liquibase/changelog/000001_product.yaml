databaseChangeLog:
  - changeSet:
      id: 1
      author: HubertKarw
      changes:
        - createTable:
            tableName: PRODUCT
            columns:
              - column:
                  name: ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: NAME
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: TYPE
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: PRICE
                  type: NUMERIC
                  constraints:
                    nullable: false

        - createTable:
            tableName: CUSTOMIZATION
            columns:
              - column:
                  name: ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: NAME
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: TYPE
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: PRICE
                  type: NUMERIC
                  constraints:
                    nullable: false
              - column:
                  name: PRODUCT_ID
                  type: BIGINT

        - createTable:
            tableName: PRODUCT_CUSTOMIZATION
            columns:
              - column:
                  name: PRODUCT_ID
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: CUSTOMIZATION_ID
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: PRODUCT_CUSTOMIZATION
            baseColumnNames: PRODUCT_ID
            referencedTableName: PRODUCT
            referencedColumnNames: ID
            constraintName: fk_product_customization_product

        - addForeignKeyConstraint:
            baseTableName: PRODUCT_CUSTOMIZATION
            baseColumnNames: CUSTOMIZATION_ID
            referencedTableName: CUSTOMIZATION
            referencedColumnNames: ID
            constraintName: fk_product_customization_customization
